<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SealPass Gate</title>
<meta name="theme-color" content="#131b31">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232fb3a6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/devices.css">
</head>
<body class="device">
<main class="wrap gate-wrap">
  <section class="card flat gate-setup">
    <div class="row spread">
      <p class="panel-title" style="margin:0">Gate scanner</p>
      <span class="chip" id="secure"></span>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <label class="field">This gate checks<select id="event"></select></label>
      <label class="field">Gate name<input type="text" id="gateName" value="Main gate" maxlength="40"></label>
    </div>
  </section>

  <section class="scanner">
    <div class="viewfinder" id="viewfinder">
      <video id="video" playsinline muted></video>
      <canvas id="frame" class="hidden"></canvas>
      <div class="vf-corners"></div>
      <div class="vf-line"></div>
      <div class="vf-idle" id="vfIdle">
        <p>Point the camera at a student's code</p>
        <button class="btn" id="camBtn" type="button">Start camera</button>
      </div>
    </div>
    <div class="row" style="justify-content:center;margin-top:12px">
      <label class="btn ghost sm" for="photo">Take a photo instead</label>
      <input type="file" id="photo" accept="image/*" capture="environment" class="sr-only">
      <button class="btn ghost sm" id="pasteBtn" type="button">Paste code text</button>
    </div>
    <p class="small muted center" id="camHint"></p>
  </section>

  <section id="resultBox" class="hidden">
    <div id="verdict"></div>
    <div id="pipe" style="margin-top:12px"></div>
  </section>

  <div class="flash" id="flash"></div>
</main>

<script src="/static/vendor/jsQR.min.js"></script>
<script src="/static/js/crypto.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/gate.js"></script>
</body>
</html>
